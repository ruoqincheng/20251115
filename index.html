<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <style>
      /* 讓主選單項目可以容納絕對定位的子選單 */
      .menu-item {
        position: relative;
      }
      /* 子選單預設隱藏 */
      .submenu {
        display: none;
        position: absolute; /* 相對於父層 .menu-item 定位 */
        left: 100%; /* 從父層右邊彈出 */
        top: 0;
        background-color: rgba(50, 50, 50, 0.9); /* 子選單背景色 */
        white-space: nowrap; /* 確保子選單文字不換行 */
      }
      /* 當滑鼠懸停在 .menu-item 上時，顯示其直屬的 .submenu */
      .menu-item:hover > .submenu {
        display: block;
      }
    </style>
  </head>

  <body style="margin: 0; background-color: black;">
    <div id="side-menu">
      <div class="menu-item"><a href="#" onclick="showIframe('https://ruoqincheng.github.io/20251020/'); return false;">第一單元作品</a></div>
      <div class="menu-item"><a href="#" onclick="showIframe('https://hackmd.io/@ppQ0FPhEQoqveC99pJ3gIQ/HJrxwmRjge/'); return false;">第一單元講義</a></div>
      <div class="menu-item"><a href="#" onclick="showIframe('https://ruoqincheng.github.io/20251109-1/'); return false;">測驗系統</a></div>
      <div class="menu-item"><a href="#" onclick="showQuizNotes(); return false;">測驗卷筆記</a></div>
      <div class="menu-item"><a href="#" onclick="showProjectNotes(); return false;">作品筆記</a></div>
      <!-- 含有子選單的項目 -->
      <div class="menu-item">
        <a href="#" onclick="showTKUPage(); return false;">淡江大學</a>
        <div class="submenu">
          <div class="menu-item"><a href="#" onclick="showETPage(); return false;">教育科技</a></div>
        </div>
      </div>
      <div class="menu-item"><a href="#" onclick="showHomePage(); return false;">回到首頁</a></div>
    </div>
    <div id="sketch-holder" style="display: flex; justify-content: center; align-items: center; height: 100vh;"></div>
    <div id="iframe-container" class="iframe-container">
      <div class="iframe-header">
        <button onclick="closeIframe()">×</button>
      </div>
      <iframe id="content-iframe" frameborder="0"></iframe>
    </div>
    <script src="sketch.js"></script>
  </body>
</html>
